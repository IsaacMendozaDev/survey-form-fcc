    <main class="main">
      <h1 id="title">freeCodeCamp Survey Form</h1>
      <p id="description">Let us know some info to improve our platform 😉</p>

      <form id="survey-form">
        <label for="name" id="name-label">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
          required
        />
        <label for="email" id="email-label">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        />
        <label for="number" id="number-label">Age</label>
        <input
          type="number"
          id="number"
          name="age"
          min="1"
          max="100"
          placeholder="Age"
          required
        />
        <label for="dropdown" id="dropdown-label"
          >Which option best describes you?</label
        >
        <select id="dropdown" name="role" required>
          <option disabled selected value>Select an option</option>
          <option value="student">Student</option>
          <option value="job">Full Time Job</option>
          <option value="learner">Full Time Learner</option>
          <option value="preferNo">Prefer not to say</option>
          <option value="other">Other</option>
        </select>
        <fieldset>
          <legend>What would you like to see improved?</legend>
          <input
            type="checkbox"
            id="feature1"
            name="feature"
            value="front-end"
          />
          <label for="feature1">Front-end</label>
          <input
            type="checkbox"
            id="feature2"
            name="feature"
            value="back-end"
          />
          <label for="feature2">Back-end</label>
          <input type="checkbox" id="feature3" name="feature" value="design" />
          <label for="feature3">Design</label>
          <input type="checkbox" id="feature4" name="feature" value="content" />
          <label for="feature4">Content</label>
          <input type="checkbox" id="feature5" name="feature" value="forum" />
          <label for="feature5">Forum</label>
        </fieldset>
        <fieldset>
          <legend>Would you recommend this site to a friend?</legend>
          <input
            type="radio"
            id="definitely"
            name="recommend"
            value="definitely"
          />
          <label for="definitely">Definitely</label>
          <input type="radio" id="maybe" name="recommend" value="maybe" />
          <label for="maybe">Maybe</label>
          <input type="radio" id="not-sure" name="recommend" value="not-sure" />
          <label for="not-sure">Not sure</label>
        </fieldset>
        <label for="comments" id="comments-label"
          >Any comment or suggestions? (Maybe this would be our next
          feature)</label
        >
        <textarea
          id="comments"
          name="comments"
          placeholder="Enter your comments here"
        ></textarea>
        <button type="submit" id="submit">Submit</button>
      </form>
    </main>
